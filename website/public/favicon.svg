<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background linear depth -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242426"/>
      <stop offset="100%" stop-color="#121213"/>
    </linearGradient>

    <!-- Subtle radial highlight at top edge -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- App icon border gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Squircle shape clipping mask (Apple standard corner curvature) -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- Base Icon Shape -->
  <g clip-path="url(#squircleClip)">
    <!-- Base fill -->
    <rect width="1024" height="1024" fill="url(#bgGradient)"/>
    
    <!-- Top inner glow -->
    <rect width="1024" height="1024" fill="url(#topGlow)"/>

    <!-- Subtle border highlight -->
    <rect x="1" y="1" width="1022" height="1022" rx="223" ry="223" fill="none" stroke="url(#borderGradient)" stroke-width="2"/>

    <!-- Foreground Icon Symbol (lines + play cursor) -->
    <g fill="#F5F5F7">
      <!-- Line 1: Top bar -->
      <rect x="204" y="274" width="466" height="58" rx="29" ry="29"/>

      <!-- Play triangle cursor -->
      <path d="M 218 382 
               C 210 376.5 204 380 204 390 
               L 204 480 
               C 204 490 210 493.5 218 488 
               L 294 443 
               C 302 438 302 432 294 427 
               Z"/>

      <!-- Line 2: Middle-upper bar (offset right) -->
      <rect x="353" y="412" width="467" height="58" rx="29" ry="29"/>

      <!-- Line 3: Middle-lower bar -->
      <rect x="204" y="550" width="466" height="58" rx="29" ry="29"/>

      <!-- Line 4: Bottom bar (offset right) -->
      <rect x="353" y="688" width="467" height="58" rx="29" ry="29"/>
    </g>
  </g>
</svg>
